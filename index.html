<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HaniTech — Business Manager</title>
<meta name="theme-color" content="#1a365d">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<!-- ═══════════════════════════════════════════
     SPLASH SCREEN
     ═══════════════════════════════════════════ -->
<div id="splashScreen">
  <div class="splash-logo">⚡ <span class="gold">HaniTech</span></div>
  <div class="splash-sub" id="splashSub">BUSINESS MANAGER</div>
  <div class="splash-loader"></div>
</div>

<!-- ═══════════════════════════════════════════
     BLOCK SCREEN (Expired / Suspended)
     ═══════════════════════════════════════════ -->
<div id="blockScreen" class="block-screen hidden">
  <div class="block-box">
    <div class="block-icon" id="blockIcon">⛔</div>
    <h2 id="blockTitle">Account Blocked</h2>
    <p id="blockMessage"></p>
    <button class="btn-login" onclick="logout()" style="margin-top:20px;">🚪 Sign Out</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     LOGIN SCREEN
     ═══════════════════════════════════════════ -->
<div id="loginScreen" class="hidden">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon" id="loginLogoIcon">⚡</div>
    </div>
    <h1 class="login-title" id="loginTitle">HaniTech</h1>
    <p class="login-subtitle" id="loginSubtitle">BUSINESS MANAGER</p>
    
    <div id="loginError"></div>
    
    <div class="form-group">
      <label>📧 Email Address</label>
      <input type="email" id="email" placeholder="your@business.com" autocomplete="off">
    </div>
    <div class="form-group">
      <label>🔒 Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="loginBtn" onclick="login()">🔓 Sign In</button>
    <div class="forgot-link">
      <a href="#" onclick="forgotPassword(event)">🔑 Forgot Password?</a>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     MAIN APP
     ═══════════════════════════════════════════ -->
<div id="mainApp">
  
  <!-- HEADER -->
  <header>
    <div class="h-left">
      <div class="h-avatar" id="hdrUserInitial">U</div>
      <div class="h-info">
        <div class="h-title" id="hdrBusinessName">Business</div>
        <div class="h-email" id="hdrUserEmail">user@email.com</div>
        <div id="mobileHeaderTitle" onclick="toggleModernMenu()">
          <span id="currentMobileTabTitle">Home</span>
          <span>▼</span>
        </div>
      </div>
    </div>
    <div class="h-right">
      <span class="role-badge" id="hdrRoleBadge">👑 Owner</span>
      <button class="h-btn" onclick="toggleDarkModeBtn()" title="Toggle Theme">🌙</button>
      <button class="h-btn" onclick="logout()" title="Sign Out">🚪</button>
    </div>
    <div class="modern-mobile-menu" id="modernMobileMenu"></div>
  </header>

  <!-- MOBILE BOTTOM NAV (dynamic ከዘርፉ ይመጣል) -->
  <div class="mobile-bottom-nav" id="mobileBottomNav"></div>

  <!-- MAIN CONTENT -->
  <div class="main-content-wrapper">
    <div class="tabs-wrapper">
      <!-- SIDEBAR (dynamic) -->
      <div class="tabs" id="sidebarNav"></div>
      
      <!-- MODULE PANELS (dynamic) -->
      <div class="panels" id="modulePanels">
        <div class="module-loading">
          <div class="spinner"></div>
          <p>⏳ በመጫን ላይ...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     GLOBAL MODAL CONTAINER
     ═══════════════════════════════════════════ -->
<div id="globalModalContainer"></div>

<!-- ═══════════════════════════════════════════
     TOAST HOST
     ═══════════════════════════════════════════ -->
<div id="toastHost"></div>

<!-- ═══════════════════════════════════════════
     SCRIPT ENTRY
     ═══════════════════════════════════════════ -->
<script>
  window.addEventListener('error', function(e) {
    var splash = document.getElementById('splashScreen');
    if (splash) {
      splash.innerHTML = '<div style="padding:20px; text-align:center; color:#fff; font-family:sans-serif;">' +
        '<h2 style="color:#ef4444; margin-bottom:10px;">⚠️ ስህተት ተፈጥሯል</h2>' +
        '<p style="background:rgba(0,0,0,0.5); padding:10px; border-radius:8px; font-size:12px; word-wrap:break-word;">' + 
        (e.message || 'Unknown error') + '</p>' +
        '<p style="font-size:10px; margin-top:10px;">' + (e.filename || '') + ' : ' + (e.lineno || '') + '</p></div>';
    }
  });
</script>
<script type="module" src="js/core.js"></script>

<!-- EXPIRY NOTIFICATION BANNER & AUTO-HOOK -->
<script>
(function() {
  let scanTimer = null;

  function createBannerIfMissing() {
    if (document.getElementById('expiryAlertBanner')) return document.getElementById('expiryAlertBanner');
    const banner = document.createElement('div');
    banner.id = 'expiryAlertBanner';
    banner.style.cssText = [
      'display:none',
      'margin:10px 14px',
      'padding:12px 14px',
      'border-radius:10px',
      'font-size:13px',
      'font-weight:700',
      'align-items:center',
      'justify-content:space-between',
      'gap:10px',
      'flex-wrap:wrap',
      'z-index:50'
    ].join(';');

    const textSpan = document.createElement('span');
    textSpan.id = 'expiryAlertText';

    const renewBtn = document.createElement('button');
    renewBtn.type = 'button';
    renewBtn.textContent = '💳 አሁን ያድሱ';
    renewBtn.style.cssText = [
      'width:auto',
      'padding:7px 12px',
      'font-size:12px',
      'border-radius:8px',
      'background:#1a365d',
      'color:#ffffff',
      'cursor:pointer',
      'border:none',
      'font-weight:700'
    ].join(';');

    renewBtn.onclick = function(e) {
  e.preventDefault();
  e.stopPropagation();

  if (typeof window.openSubscriptionBillingSection === 'function') {
    window.openSubscriptionBillingSection();
    return;
  }

  // 1. Settings ወይም Subscription የሚመስል tab/button ካለ እንዲከፈት እንጫነዋለን
  const allTriggers = Array.from(document.querySelectorAll('#mobileBottomNav button, #mobileBottomNav a, #sidebarNav button, #sidebarNav a, #modernMobileMenu button, #modernMobileMenu a, button, a'));
  const targetTrigger = allTriggers.find(el => {
    if (el === renewBtn) return false;
    const txt = (el.textContent || '').toLowerCase();
    const attr = [
      el.id || '',
      el.className || '',
      el.getAttribute('data-tab') || '',
      el.getAttribute('data-panel') || '',
      el.getAttribute('data-section') || '',
      el.getAttribute('onclick') || ''
    ].join(' ').toLowerCase();

    return txt.includes('settings') || txt.includes('ተመልካች') || txt.includes('sub') || txt.includes('billing') || txt.includes('ክፍያ')
      || attr.includes('setting') || attr.includes('sub') || attr.includes('billing');
  });

  if (targetTrigger) {
    targetTrigger.click();
  }

  // 2. ክፍሉ ከተከፈተ በኋላ ወደ ቅጹ ይወርዳል (ካልተገኘ መልእክት ያሳያል)
  setTimeout(() => {
    const formTarget = document.getElementById('subReqCycle')
      || document.getElementById('subReqBtn')
      || document.querySelector('[id*="subReq"], [class*="subscription"], [class*="billing"]');

    if (formTarget) {
      formTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
      formTarget.focus?.();
    } else if (typeof window.showToast === 'function') {
      window.showToast('ℹ️ እባክዎ ከታች ያለውን Settings / ተመልካች ነክተው Subscription ክፍል ይግቡ');
    } else {
      alert('እባክዎ ከታች ያለውን Settings / ተመልካች ነክተው Subscription ክፍል ይግቡ።');
    }
  }, 300);
};


    banner.appendChild(textSpan);
    banner.appendChild(renewBtn);

    const anchor = document.querySelector('#mainApp .main-content-wrapper, #mainApp, #app, .app-container, .main-content, main') || document.body;
    anchor.insertBefore(banner, anchor.firstChild);
    return banner;
  }

  window.renderExpiryNotification = function(expiryDateStr) {
    const banner = createBannerIfMissing();
    const textEl = document.getElementById('expiryAlertText');
    if (!banner || !textEl) return;

    if (!expiryDateStr) {
      banner.style.display = 'none';
      return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const exp = new Date(expiryDateStr);
    exp.setHours(0, 0, 0, 0);

    if (isNaN(exp.getTime())) {
      banner.style.display = 'none';
      return;
    }

    const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));

    if (diffDays > 7) {
      banner.style.display = 'none';
      return;
    }

    banner.style.display = 'flex';

    if (diffDays < 0) {
      banner.style.background = 'rgba(239, 68, 68, 0.14)';
      banner.style.border = '1px solid #ef4444';
      banner.style.color = '#ef4444';
      textEl.textContent = `🚨 የደንበኝነት ጊዜዎ ከ ${Math.abs(diffDays)} ቀን በፊት (${expiryDateStr}) አልፏል!`;
    } else if (diffDays === 0) {
      banner.style.background = 'rgba(245, 158, 11, 0.16)';
      banner.style.border = '1px solid #f59e0b';
      banner.style.color = '#d97706';
      textEl.textContent = `⚠️ የደንበኝነት ጊዜዎ ዛሬ (${expiryDateStr}) ያበቃል!`;
    } else {
      banner.style.background = 'rgba(245, 158, 11, 0.14)';
      banner.style.border = '1px solid #f59e0b';
      banner.style.color = '#d97706';
      textEl.textContent = `⏳ የደንበኝነት ጊዜዎ በ ${diffDays} ቀን ውስጥ (${expiryDateStr}) ያበቃል!`;
    }
  };

  function scanDomForExpiryDate() {
    const exp = window.state?.tenantData?.expiryDate || window.tenantData?.expiryDate;
    if (exp) {
      window.renderExpiryNotification(exp);
      return;
    }
    const mainApp = document.getElementById('mainApp');
    const match = (mainApp?.innerText || '').match(/\b(20\d{2}-\d{2}-\d{2})\b/);
    if (match && match[1]) {
      window.renderExpiryNotification(match[1]);
    }
  }

  function scheduleScan() {
    clearTimeout(scanTimer);
    scanTimer = setTimeout(scanDomForExpiryDate, 150);
  }

  window.addEventListener('DOMContentLoaded', () => {
    createBannerIfMissing();
    setTimeout(scanDomForExpiryDate, 800);
    const mainApp = document.getElementById('mainApp') || document.body;
    const observer = new MutationObserver(scheduleScan);
    observer.observe(mainApp, { childList: true, subtree: true });
  });
})();
</script>
</body>
</html>
